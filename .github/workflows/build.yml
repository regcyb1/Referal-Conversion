name: Build apps

# Builds the Windows .exe and macOS .dmg on GitHub's machines.
# - Every push to main: download them from the run's "Artifacts" section.
# - Push a tag like v1.0.0: they are also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Assessment-PDF-to-Excel-windows
            path: dist/Assessment PDF to Excel.exe
          - os: macos-latest
            artifact: Assessment-PDF-to-Excel-mac
            path: dist/Assessment-PDF-to-Excel-mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r installer/requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows .exe
        if: runner.os == 'Windows'
        run: python -m PyInstaller installer/converter.spec --noconfirm --clean

      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        env:
          PYTHON: python
        run: bash installer/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
